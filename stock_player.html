<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>股票大富翁</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#131a24;--line:#212c3b;--txt:#e6edf5;--dim:#7d8ea3;
    --up:#ff4d5e;--down:#00d68f;--flat:#8b9bb0;--a:#ffb648;--b:#4da3ff;--c:#c77dff;--gold:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  #app{max-width:460px;margin:0 auto;padding:14px 14px 190px}
  #entry{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px}
  #entry h1{font-size:26px;letter-spacing:.06em}
  #entry p{font-size:13px;color:var(--dim);text-align:center;line-height:1.9}
  #nameInput{width:100%;max-width:280px;background:#0d131c;border:1px solid var(--line);color:var(--txt);font-size:18px;padding:14px;border-radius:10px;text-align:center;font-family:inherit}
  #nameInput:focus{outline:none;border-color:#3a4a60}
  #entryBtn{width:100%;max-width:280px;background:var(--up);border:none;color:#fff;font-size:17px;font-weight:700;padding:15px;border-radius:10px;font-family:inherit;cursor:pointer}
  #hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:12px}
  #heroTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  #who{font-size:12px;color:var(--dim)}
  #statePill{font-size:11px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  #statePill.open{color:var(--up);border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.08)}
  #statePill.closing{color:var(--gold);border-color:rgba(255,209,102,.5);background:rgba(255,209,102,.08)}
  #totalLbl{font-size:11px;color:var(--dim);letter-spacing:.2em}
  #total{font-size:40px;font-weight:800;line-height:1.15}
  #heroRow{display:flex;gap:20px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  #heroRow b{color:var(--txt);font-weight:600}
  .sec{font-size:11px;letter-spacing:.22em;color:var(--dim);margin:16px 2px 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k)}
  .card.sel{border-color:var(--k);background:#182130}
  .r1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .nm{font-size:15px;font-weight:600}
  .mode{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .mode.m-growth{color:var(--gold);border-color:rgba(255,209,102,.4)}
  .mode.m-spec{color:var(--c);border-color:rgba(199,125,255,.4)}
  .r2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .px{font-size:26px;font-weight:700;line-height:1}
  .chg{font-size:13px;font-weight:600;margin-left:7px}
  .spark{width:96px;height:34px;flex:none}
  .r3{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
  .r3 b{font-weight:600}
  #bar{position:fixed;left:0;right:0;bottom:0;background:rgba(13,19,28,.97);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
  #barIn{max-width:460px;margin:0 auto}
  #barTop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12px}
  #barName{font-weight:700;font-size:14px}
  #barHint{color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .grid+.grid{margin-top:7px}
  .tbtn{font-family:inherit;font-size:15px;font-weight:700;padding:13px 0;border-radius:10px;border:1px solid;background:transparent;cursor:pointer}
  .buy{border-color:rgba(255,77,94,.55);color:var(--up)}
  .buy:active:not(:disabled){background:rgba(255,77,94,.16)}
  .sell{border-color:rgba(0,214,143,.55);color:var(--down)}
  .sell:active:not(:disabled){background:rgba(0,214,143,.16)}
  .tbtn:disabled{opacity:.28;cursor:not-allowed}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:200px;background:#1c2634;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
  #toast.show{opacity:1}
  #cd{position:fixed;inset:0;background:rgba(10,14,20,.86);z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #cd.show{display:flex}
  #cdNum{font-size:120px;font-weight:800;color:var(--gold);line-height:1}
  #cd span{font-size:14px;letter-spacing:.3em;color:var(--txt)}
  #conn{position:fixed;top:8px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gold);background:rgba(10,14,20,.95);border:1px solid rgba(255,209,102,.4);padding:4px 12px;border-radius:999px;z-index:30;display:none}
  #conn.show{display:block}
</style>
</head>
<body>

<div id="entry">
  <h1>股票大富翁</h1>
  <p>輸入你的名字就可以進場。<br>開盤後隨時買進賣出，最後比總資產。</p>
  <input id="nameInput" maxlength="8" placeholder="你的名字" autocomplete="off">
  <button id="entryBtn">進場</button>
</div>

<div id="conn">連線中斷，重新連線中…</div>

<div id="app">
  <div id="hero">
    <div id="heroTop"><div id="who">—</div><div id="statePill">尚未開盤</div></div>
    <div id="totalLbl">總資產</div>
    <div id="total" class="num">100,000</div>
    <div id="heroRow">
      <div>現金 <b id="cash" class="num">100,000</b></div>
      <div>本回合損益 <b id="rpl" class="num">0</b></div>
      <div>第 <b id="round">1</b> ／ 5 回合</div>
    </div>
  </div>
  <div class="sec">選一支下單</div>
  <div id="cards"></div>
</div>

<div id="bar"><div id="barIn">
  <div id="barTop"><span id="barName">請先選一支股票</span><span id="barHint">—</span></div>
  <div class="grid">
    <button class="tbtn buy" data-act="b1">買 1</button>
    <button class="tbtn buy" data-act="b5">買 5</button>
    <button class="tbtn buy" data-act="ba">全押</button>
  </div>
  <div class="grid">
    <button class="tbtn sell" data-act="s1">賣 1</button>
    <button class="tbtn sell" data-act="s5">賣 5</button>
    <button class="tbtn sell" data-act="sa">全賣</button>
  </div>
</div></div>

<div id="cd"><div id="cdNum">3</div><span>即將關盤</span></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyAoLICybR4P-bzVb_wCwcscsQ3Pd7yiT2s",
  authDomain: "kuya-stock-game.firebaseapp.com",
  databaseURL: "https://kuya-stock-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kuya-stock-game",
  storageBucket: "kuya-stock-game.firebasestorage.app",
  messagingSenderId: "34287693549",
  appId: "1:34287693549:web:c617470b93badfaa7a66e4"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=id=>document.getElementById(id);
const START_CASH=100000, ROUNDS=5, HIST=40, IDS=['A','B','C'];
const COLOR={A:'--a',B:'--b',C:'--c'};
const MODE_LABEL={stable:'穩健',growth:'成長',spec:'投機'};
const money=n=>Math.round(n).toLocaleString('en-US');

let stocks={}, state='idle', round=1, sel=null, prevState='idle';
let me={name:'',cash:START_CASH,hold:{A:0,B:0,C:0},cost:{A:0,B:0,C:0}};
let roundStartAsset=START_CASH, myRef=null, ready=false;

/* ───────── 身分 ───────── */
let pid=localStorage.getItem('kuya_stock_pid');
if(!pid){ pid='p_'+Math.random().toString(36).slice(2,10); localStorage.setItem('kuya_stock_pid',pid); }
const savedName=localStorage.getItem('kuya_stock_name');

db.ref('.info/connected').on('value',s=>{ $('conn').classList.toggle('show', s.val()!==true); });

/* ───────── 讀行情 ───────── */
db.ref('market').on('value',snap=>{
  const d=snap.val(); if(!d) return;
  prevState=state; state=d.state||'idle'; round=d.round||1;
  if(d.stocks){
    IDS.forEach(id=>{
      const r=d.stocks[id]; if(!r) return;
      if(!stocks[id]) stocks[id]={id,name:r.name,price:r.price,open:r.open,mode:r.mode,hist:[r.price]};
      const s=stocks[id];
      if(prevState!=='open'&&state==='open') s.hist=[r.price];
      else if(r.price!==s.price){ s.hist.push(r.price); if(s.hist.length>HIST) s.hist.shift(); }
      s.name=r.name; s.price=r.price; s.open=r.open; s.mode=r.mode;
    });
  }
  if(prevState!=='open'&&state==='open') roundStartAsset=totalAsset();
  if(prevState!=='closing'&&state==='closing') runCountdown();
  render();
});

function runCountdown(){
  let n=3; const cd=$('cd'); cd.classList.add('show'); $('cdNum').textContent=n;
  const t=setInterval(()=>{ n--; if(n>0){$('cdNum').textContent=n;return;} clearInterval(t); cd.classList.remove('show'); },1000);
}

/* ───────── 資產 ───────── */
function holdValue(){ return IDS.reduce((a,id)=> a + (stocks[id]? stocks[id].price*me.hold[id] : 0), 0); }
function totalAsset(){ return me.cash + holdValue(); }
function stockPL(s){ return me.hold[s.id] ? (s.price-me.cost[s.id])*me.hold[s.id] : 0; }

function saveMe(){
  if(!myRef) return;
  myRef.update({name:me.name,cash:+me.cash.toFixed(2),hold:me.hold,cost:me.cost,total:+totalAsset().toFixed(2),updatedAt:Date.now()});
}

/* 資產隨股價變動，定時回寫給排行榜用 */
setInterval(()=>{ if(ready&&(state==='open'||state==='closing')) saveMe(); },1500);

/* ───────── 交易 ───────── */
const tradable=()=> state==='open';
function buy(s,units){
  if(!tradable()) return toast('目前不能交易');
  const n=Math.min(units,Math.floor(me.cash/s.price));
  if(n<=0) return toast('現金不足，買不了');
  const cost=n*s.price, h=me.hold[s.id];
  me.cost[s.id]=(me.cost[s.id]*h+cost)/(h+n);
  me.hold[s.id]=h+n; me.cash-=cost;
  toast(`買進 ${s.name} ${n} 單位`); saveMe(); render();
}
function sell(s,units){
  if(!tradable()) return toast('目前不能交易');
  const n=Math.min(units,me.hold[s.id]);
  if(n<=0) return toast('沒有持股可賣');
  me.cash+=n*s.price; me.hold[s.id]-=n;
  if(me.hold[s.id]===0) me.cost[s.id]=0;
  toast(`賣出 ${s.name} ${n} 單位`); saveMe(); render();
}

let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1300);
}

/* ───────── 畫面 ───────── */
function sparkline(s){
  const h=s.hist,n=h.length; if(n<2) return '';
  const lo=Math.min(...h),hi=Math.max(...h),span=(hi-lo)||1;
  const pts=h.map((p,i)=>`${(i/(n-1)*94+1).toFixed(1)},${(31-(p-lo)/span*28).toFixed(1)}`).join(' ');
  const col=s.price>=s.open?'var(--up)':'var(--down)';
  return `<svg class="spark" viewBox="0 0 96 34"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function render(){
  const total=totalAsset(), rpl=total-roundStartAsset;
  $('total').textContent=money(total);
  $('total').style.color=rpl>0?'var(--up)':rpl<0?'var(--down)':'var(--txt)';
  $('cash').textContent=money(me.cash);
  $('rpl').textContent=(rpl>0?'+':'')+money(rpl);
  $('rpl').style.color=rpl>0?'var(--up)':rpl<0?'var(--down)':'var(--txt)';
  $('round').textContent=round;
  $('who').textContent=me.name||'—';

  const pill=$('statePill'); pill.className='';
  if(state==='open'){pill.textContent='開盤中';pill.className='open';}
  else if(state==='closing'){pill.textContent='關盤倒數';pill.className='closing';}
  else if(state==='closed') pill.textContent='已關盤';
  else pill.textContent='尚未開盤';

  $('cards').innerHTML=IDS.map(id=>{
    const s=stocks[id]; if(!s) return '';
    const chg=(s.price/s.open-1)*100;
    const col=chg>0.001?'var(--up)':chg<-0.001?'var(--down)':'var(--flat)';
    const pl=stockPL(s), plCol=pl>0?'var(--up)':pl<0?'var(--down)':'var(--dim)';
    const mcls=s.mode==='growth'?'m-growth':s.mode==='spec'?'m-spec':'';
    return `<div class="card${sel===id?' sel':''}" data-id="${id}" style="--k:var(${COLOR[id]})">
      <div class="r1"><div class="nm">${s.name}</div><div class="mode ${mcls}">${MODE_LABEL[s.mode]||''}</div></div>
      <div class="r2">
        <div><span class="px num" style="color:${col}">${s.price.toFixed(1)}</span><span class="chg num" style="color:${col}">${chg>0?'+':''}${chg.toFixed(2)}%</span></div>
        ${sparkline(s)}
      </div>
      <div class="r3">
        <span>持有 <b class="num">${me.hold[id]}</b> 單位</span>
        <span>成本 <b class="num">${me.hold[id]?me.cost[id].toFixed(1):'—'}</b></span>
        <span style="color:${plCol}">損益 <b class="num">${pl>0?'+':''}${money(pl)}</b></span>
      </div>
    </div>`;
  }).join('');

  const s=stocks[sel];
  $('barName').textContent=s?s.name:'請先選一支股票';
  $('barHint').textContent=!s?'—':!tradable()?'關盤中，暫停交易':`可買 ${Math.floor(me.cash/s.price)} 單位｜持有 ${me.hold[s.id]}`;
  document.querySelectorAll('.tbtn').forEach(b=>{ b.disabled=!s||!tradable(); });
}

/* ───────── 綁定 ───────── */
$('cards').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c) return;
  sel=c.dataset.id; render();
});
document.querySelectorAll('.tbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    const s=stocks[sel]; if(!s) return;
    const a=b.dataset.act;
    if(a==='b1') buy(s,1);
    else if(a==='b5') buy(s,5);
    else if(a==='ba') buy(s,Math.floor(me.cash/s.price));
    else if(a==='s1') sell(s,1);
    else if(a==='s5') sell(s,5);
    else if(a==='sa') sell(s,me.hold[s.id]);
  });
});

function enter(name){
  me.name=name;
  localStorage.setItem('kuya_stock_name',name);
  myRef=db.ref('players/'+pid);
  myRef.once('value').then(snap=>{
    const d=snap.val();
    if(d){ me.cash=d.cash; me.hold=Object.assign({A:0,B:0,C:0},d.hold||{}); me.cost=Object.assign({A:0,B:0,C:0},d.cost||{}); }
    else { myRef.set({name,cash:START_CASH,hold:me.hold,cost:me.cost,total:START_CASH,joinedAt:Date.now()}); }
    roundStartAsset=totalAsset();
    ready=true;
    $('entry').style.display='none';
    render();
  });
}
$('entryBtn').onclick=()=>{
  const n=$('nameInput').value.trim();
  if(!n) return $('nameInput').focus();
  enter(n);
};
$('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('entryBtn').click(); });
if(savedName){ $('nameInput').value=savedName; }

setInterval(render,300);
})();
</script>
</body>
</html>
