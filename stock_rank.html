<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>股票大富翁｜行情 × 排行榜</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#131a24;--line:#212c3b;--txt:#e6edf5;--dim:#7d8ea3;
    --up:#ff4d5e;--down:#00d68f;--flat:#8b9bb0;--gold:#ffd166;--silver:#c9d4e0;--bronze:#d99b6a;
    --a:#ffb648;--b:#4da3ff;--c:#c77dff;
    --row:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;height:100vh;overflow:hidden}
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  #wrap{height:100vh;display:flex;flex-direction:column;padding:22px 26px 18px}

  /* ───── 頂部 ───── */
  #head{display:flex;align-items:baseline;gap:18px;margin-bottom:14px;flex-wrap:nowrap}
  #ttl{font-size:15px;letter-spacing:.3em;color:var(--dim)}
  #round{font-size:30px;font-weight:800;white-space:nowrap}
  #round small{font-size:14px;color:var(--dim);font-weight:400;margin-left:4px}
  #clock{font-size:30px;font-weight:800;letter-spacing:.04em}
  #clock.warn{color:var(--gold)}
  #state{font-size:13px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);color:var(--dim);letter-spacing:.1em;white-space:nowrap}
  #state.open{color:var(--up);border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.08)}
  #state.closing{color:var(--gold);border-color:rgba(255,209,102,.5);background:rgba(255,209,102,.08)}
  #count{margin-left:auto;font-size:14px;color:var(--dim);white-space:nowrap}
  #count b{color:var(--txt);font-weight:700}

  /* ───── 主體：左圖右榜 ───── */
  #body{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:20px;min-height:0}

  #chartCol{display:flex;flex-direction:column;min-height:0;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 10px 8px 4px}
  #chartWrap{flex:1;position:relative;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%}
  #legend{display:flex;gap:20px;justify-content:center;padding:8px 0 2px;font-size:14px;color:var(--dim);flex-wrap:wrap}
  #legend .lg{display:flex;align-items:center;gap:7px}
  #legend .dot{width:11px;height:11px;border-radius:3px;display:inline-block}

  #rankCol{display:flex;flex-direction:column;min-height:0}
  #colhead{display:grid;grid-template-columns:56px 1fr 96px;padding:0 14px 8px;font-size:11px;letter-spacing:.18em;color:var(--dim)}
  #colhead .r{text-align:right}

  #board{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;
    border-top:1px solid var(--line);padding-top:8px;
    scrollbar-width:thin;scrollbar-color:#2b3a4d transparent;}
  #board::-webkit-scrollbar{width:9px}
  #board::-webkit-scrollbar-thumb{background:#2b3a4d;border-radius:99px}
  #list{position:relative}

  .row{position:absolute;left:0;right:0;height:calc(var(--row) - 8px);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    display:grid;grid-template-columns:56px 1fr 96px;align-items:center;padding:0 14px;
    transition:transform .45s cubic-bezier(.22,.8,.28,1),border-color .3s,background .3s;}
  .row .rk{font-size:22px;font-weight:800;color:var(--dim)}
  .row.top1{border-color:rgba(255,209,102,.55);background:rgba(255,209,102,.07)}
  .row.top1 .rk{color:var(--gold)}
  .row.top2 .rk{color:var(--silver)}
  .row.top3 .rk{color:var(--bronze)}
  .row .nm{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
  .row .rt{font-size:20px;font-weight:700;text-align:right}
  /* 15 名以後縮小，維持投影主體聚焦前段班 */
  .row.minor{height:calc(46px - 8px)}
  .row.minor .rk{font-size:16px}
  .row.minor .nm{font-size:15px}
  .row.minor .rt{font-size:16px}

  #empty{padding:50px 14px;text-align:center;color:var(--dim);font-size:14px;line-height:2}
</style>
</head>
<body>
<div id="wrap">
  <div id="head">
    <div id="ttl">股票大富翁</div>
    <div id="round">第 1 回合<small>／ 5</small></div>
    <div id="clock" class="num">--:--</div>
    <div id="state">尚未開盤</div>
    <div id="count">參與人數 <b id="pn">0</b></div>
  </div>

  <div id="body">
    <div id="chartCol">
      <div id="chartWrap"><canvas id="cv"></canvas></div>
      <div id="legend"></div>
    </div>

    <div id="rankCol">
      <div id="colhead"><div>名次</div><div>玩家</div><div class="r">投報率</div></div>
      <div id="board">
        <div id="list"></div>
        <div id="empty">目前還沒有玩家進場。<br>請玩家掃碼進場並輸入名字。</div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyAoLICybR4P-bzVb_wCwcscsQ3Pd7yiT2s",
  authDomain: "kuya-stock-game.firebaseapp.com",
  databaseURL: "https://kuya-stock-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kuya-stock-game",
  storageBucket: "kuya-stock-game.firebasestorage.app",
  messagingSenderId: "34287693549",
  appId: "1:34287693549:web:c617470b93badfaa7a66e4"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=id=>document.getElementById(id);
const IDS=['A','B','C'], VAR={A:'--a',B:'--b',C:'--c'};
const START_CASH=100000, ROUNDS=5, ROW=64, TOP_BIG=15, WINDOW_SEC=84;

let stocks={}, players={}, state='idle', round=1;
let endAt=0, roundSec=90, warnSec=10, srvOffset=0;
/* 各股自行累積的歷史點：{A:[{t,p}], ...}，t 為本機 performance.now() */
let hist={A:[],B:[],C:[]}, lastRoundKey='';

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

db.ref('.info/serverTimeOffset').on('value',s=>{ srvOffset=s.val()||0; });

/* ───────── 行情 ───────── */
db.ref('market').on('value',snap=>{
  const d=snap.val(); if(!d) return;
  state=d.state||'idle'; round=d.round||1;
  endAt=d.endAt||0; roundSec=d.roundSec||90; warnSec=d.warnSec||10;
  stocks=d.stocks||{};

  /* 換回合 or 重新開盤 → 清空歷史，讓每回合是獨立一張圖 */
  const rk=round+'|'+(d.stocks&&d.stocks.A?d.stocks.A.open:0);
  if(rk!==lastRoundKey){ hist={A:[],B:[],C:[]}; lastRoundKey=rk; }

  /* 累積當下價格 */
  const now=performance.now();
  IDS.forEach(id=>{
    const s=stocks[id]; if(!s) return;
    const arr=hist[id];
    if(!arr.length || arr[arr.length-1].p!==+s.price) arr.push({t:now,p:+s.price});
    /* 只保留視窗內＋少量緩衝，避免無限增長 */
    const cut=now-(WINDOW_SEC+5)*1000;
    while(arr.length>2 && arr[0].t<cut) arr.shift();
  });

  renderHead(); renderLegend();
});

/* ───────── 玩家 ───────── */
db.ref('players').on('value',snap=>{ players=snap.val()||{}; renderBoard(); });

/* ───────── 頂部 ───────── */
function renderHead(){
  $('round').innerHTML=`第 ${round} 回合<small>／ ${ROUNDS}</small>`;
  const st=$('state'); st.className='';
  if(state==='open'){st.textContent='開盤中';st.className='open';}
  else if(state==='closing'){st.textContent='關盤倒數';st.className='closing';}
  else if(state==='closed') st.textContent='已關盤';
  else st.textContent='尚未開盤';
}
function tickClock(){
  const c=$('clock');
  if(state!=='open' && state!=='closing'){ c.textContent='--:--'; c.classList.remove('warn'); return; }
  const left=Math.max(0,Math.round((endAt-(Date.now()+srvOffset))/1000));
  const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0');
  c.textContent=m+':'+s;
  c.classList.toggle('warn', left<=warnSec);
}
setInterval(tickClock,250);

function renderLegend(){
  $('legend').innerHTML=IDS.map(id=>{
    const s=stocks[id]; if(!s) return '';
    const chg=(s.price/s.open-1)*100;
    const col=chg>0.001?'var(--up)':chg<-0.001?'var(--down)':'var(--flat)';
    return `<span class="lg"><span class="dot" style="background:var(${VAR[id]})"></span>`
         + `${s.name||id} <b class="num" style="color:${col}">${chg>0?'+':''}${chg.toFixed(2)}%</b></span>`;
  }).join('');
}

/* ───────── 趨勢圖（絕對價格、自動縮放、右側現價標籤） ───────── */
const cv=$('cv'), ctx=cv.getContext('2d');
function resize(){
  const r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize); resize();

function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  const has=IDS.some(id=>hist[id]&&hist[id].length);
  if(!has){ requestAnimationFrame(draw); return; }

  const padL=60,padR=86,padT=16,padB=20;
  const iw=w-padL-padR, ih=h-padT-padB;
  const now=performance.now(), t1=now, t0=now-WINDOW_SEC*1000;

  let lo=Infinity,hi=-Infinity;
  IDS.forEach(id=>hist[id].forEach(pt=>{ if(pt.t>=t0){ lo=Math.min(lo,pt.p); hi=Math.max(hi,pt.p); } }));
  if(!isFinite(lo)){ lo=0; hi=1; }
  const pad=(hi-lo)*0.12||hi*0.05||1;
  const ymin=lo-pad, ymax=hi+pad;
  const toX=t=>padL+iw*Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
  const toY=p=>padT+ih*(1-(p-ymin)/(ymax-ymin));

  /* 格線 + Y 軸刻度 */
  ctx.font='11px ui-monospace,monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=6;i++){
    const y=padT+ih*i/6, val=ymax-(ymax-ymin)*i/6;
    ctx.strokeStyle='#19212d'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,y+.5); ctx.lineTo(w-padR,y+.5); ctx.stroke();
    ctx.fillStyle='#5d6d82'; ctx.fillText(val.toFixed(0),padL-10,y);
  }

  IDS.forEach(id=>{
    const arr=hist[id]; if(!arr||!arr.length) return;
    const pts=arr.filter(pt=>pt.t>=t0-3000);
    if(!pts.length) return;
    const col=css(VAR[id]);
    ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    pts.forEach((pt,i)=>{const x=toX(pt.t),y=toY(pt.p); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    const last=pts[pts.length-1];
    ctx.lineTo(toX(now),toY(last.p)); ctx.stroke();
    const ex=Math.min(toX(now),w-padR), ey=toY(last.p);
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(ex,ey,4,0,7); ctx.fill();
    ctx.globalAlpha=.18; ctx.beginPath(); ctx.arc(ex,ey,10,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.textAlign='left'; ctx.font='bold 13px ui-monospace,monospace';
    ctx.fillText(last.p.toFixed(1),ex+12,ey);
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ───────── 排行榜 ───────── */
function assetOf(p){
  let v=p.cash||0;
  IDS.forEach(id=>{ const h=(p.hold&&p.hold[id])||0; if(h && stocks[id]) v+=h*stocks[id].price; });
  return v;
}
function renderBoard(){
  const arr=Object.keys(players).map(k=>{
    const p=players[k]||{};
    const a=assetOf(p);
    return {id:k,name:p.name||'—',ret:(a/START_CASH-1)*100,asset:a};
  }).sort((x,y)=>y.asset-x.asset);

  $('pn').textContent=arr.length;
  $('empty').style.display=arr.length?'none':'block';

  /* 前 15 名 ROW 高、其後 minor 高，計算各自 y 位移 */
  const MINOR=46;
  let acc=0, ys=[];
  arr.forEach((p,i)=>{ ys.push(acc); acc += (i<TOP_BIG?ROW:MINOR); });
  $('list').style.height=acc+'px';

  const list=$('list'), seen={};
  arr.forEach((p,i)=>{
    let el=list.querySelector('[data-id="'+p.id+'"]');
    if(!el){
      el=document.createElement('div');
      el.className='row'; el.dataset.id=p.id;
      el.style.transform='translateY('+ys[i]+'px)';
      el.innerHTML='<div class="rk num"></div><div class="nm"></div><div class="rt num"></div>';
      list.appendChild(el);
    }
    el.style.transform='translateY('+ys[i]+'px)';
    el.className='row'+(i===0?' top1':i===1?' top2':i===2?' top3':'')+(i>=TOP_BIG?' minor':'');
    el.querySelector('.rk').textContent=i+1;
    el.querySelector('.nm').textContent=p.name;
    const rt=el.querySelector('.rt');
    rt.textContent=(p.ret>0?'+':'')+p.ret.toFixed(1)+'%';
    rt.style.color=p.ret>0.001?'var(--up)':p.ret<-0.001?'var(--down)':'var(--flat)';
    seen[p.id]=1;
  });
  list.querySelectorAll('.row').forEach(el=>{ if(!seen[el.dataset.id]) el.remove(); });
}

/* 股價持續跳動，排行榜每 500ms 重算一次 */
setInterval(renderBoard,500);
})();
</script>
</body>
</html>
