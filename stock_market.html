<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>股票大富翁｜行情主機</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#121822;--line:#1e2836;--txt:#e6edf5;--dim:#7d8ea3;
    --up:#ff4d5e;--down:#00d68f;--flat:#8b9bb0;
    --a:#ffb648;--b:#4da3ff;--c:#c77dff;--gold:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;height:100vh;overflow:hidden}
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  #app{display:grid;grid-template-columns:1fr 340px;height:100vh}
  #left{display:flex;flex-direction:column;padding:18px 18px 14px;min-width:0}
  #topbar{display:flex;align-items:baseline;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  #title{font-size:15px;letter-spacing:.28em;color:var(--dim)}
  #round{font-size:30px;font-weight:800}
  #round small{font-size:14px;color:var(--dim);font-weight:400;margin-left:4px}
  #state{font-size:13px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);color:var(--dim);letter-spacing:.1em}
  #state.open{color:var(--up);border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.08)}
  #state.closing{color:var(--gold);border-color:rgba(255,209,102,.5);background:rgba(255,209,102,.08)}
  #clock{margin-left:auto;font-size:22px;color:var(--dim)}
  #chartwrap{flex:1;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #legend{display:flex;gap:22px;margin-top:10px;font-size:12px;color:var(--dim);align-items:center;flex-wrap:wrap}
  .lg{display:flex;align-items:center;gap:7px}
  .lg i{width:16px;height:3px;border-radius:2px;display:block}
  #axisToggle{margin-left:auto;display:flex;gap:6px}
  #axisToggle button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
  #axisToggle button.on{color:var(--txt);border-color:#3a4a60;background:#1a2230}
  #right{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:18px 16px 40px}
  .sec{font-size:11px;letter-spacing:.22em;color:var(--dim);margin:22px 0 10px}
  .sec:first-child{margin-top:0}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k)}
  .card .row1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px}
  .card .nm{font-size:14px;font-weight:600}
  .card .mode{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .card .mode.m-growth{color:var(--gold);border-color:rgba(255,209,102,.4)}
  .card .mode.m-spec{color:var(--c);border-color:rgba(199,125,255,.4)}
  .card .px{font-size:27px;font-weight:700;line-height:1.1}
  .card .chg{font-size:14px;margin-left:8px;font-weight:600}
  .card .meta{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:7px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.act{font-family:inherit;font-size:14px;font-weight:600;padding:13px 0;border-radius:9px;border:1px solid var(--line);background:#1a2230;color:var(--txt);cursor:pointer;letter-spacing:.05em}
  button.act:hover:not(:disabled){border-color:#3a4a60}
  button.act:disabled{opacity:.32;cursor:not-allowed}
  button.act.pri{background:var(--up);border-color:var(--up);color:#fff}
  button.act.warn{background:transparent;border-color:rgba(255,209,102,.5);color:var(--gold)}
  button.act.danger{background:transparent;border-color:rgba(255,77,94,.35);color:var(--up);font-size:12px;padding:10px 0}
  button.act.full{grid-column:1/-1}
  .p{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
  .p label{flex:1;color:var(--dim)}
  .p input{width:80px;background:#0d131c;border:1px solid var(--line);color:var(--txt);padding:5px 7px;border-radius:6px;font-family:ui-monospace,monospace;font-size:12px;text-align:right}
  .p input.name{width:110px;text-align:left;font-family:inherit}
  .p input:focus{outline:none;border-color:#3a4a60}
  .hint{font-size:11px;color:var(--dim);line-height:1.7;margin-top:8px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  #conn{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);margin-bottom:14px}
  #dot{width:7px;height:7px;border-radius:50%;background:var(--up)}
  #dot.ok{background:var(--down)}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="topbar">
      <div id="title">行情主機</div>
      <div id="round">第 1 回合<small>／ 5</small></div>
      <div id="state">尚未開盤</div>
      <div id="clock" class="num">00:00</div>
    </div>
    <div id="chartwrap">
      <canvas id="cv"></canvas>
    </div>
    <div id="legend">
      <div class="lg"><i style="background:var(--a)"></i><span id="lgA">A股</span></div>
      <div class="lg"><i style="background:var(--b)"></i><span id="lgB">B股</span></div>
      <div class="lg"><i style="background:var(--c)"></i><span id="lgC">C股</span></div>
      <div class="lg" style="color:var(--dim)">線上玩家 <b id="pcount" class="num">0</b></div>
      <div id="axisToggle">
        <button id="btnPct" class="on">漲跌幅 %</button>
        <button id="btnAbs">絕對價格</button>
      </div>
    </div>
  </div>

  <div id="right">
    <div id="conn"><i id="dot"></i><span id="connTxt">連線中…</span></div>

    <div class="sec">即時報價</div>
    <div id="cards"></div>

    <div class="sec">盤面控制</div>
    <div class="p"><label>回合時間（秒）</label><input id="pRoundSec" value="90"></div>
    <div class="p"><label>結束前提示（秒）</label><input id="pWarnSec" value="10"></div>
    <div class="btns">
      <button class="act pri full" id="btnOpen">開盤</button>
      <button class="act warn full" id="btnEarly" disabled style="font-size:12px;padding:10px 0">提前結束本回合</button>
      <button class="act full" id="btnReset">重置盤面</button>
      <button class="act danger full" id="btnClear">清除所有玩家資料</button>
    </div>
    <div class="hint">空白鍵＝開盤。開盤後自動計時，時間到自動關盤；「提前結束」僅供臨時中斷使用。重置盤面只重設股價與回合，不會動到玩家資產。</div>

    <div class="divider"></div>

    <div class="sec">股票設定</div>
    <div class="p"><label>A</label><input id="nA" class="name" value="穩鋼工業"><input id="pBaseA" value="1000"></div>
    <div class="p"><label>B</label><input id="nB" class="name" value="躍昇科技"><input id="pBaseB" value="1000"></div>
    <div class="p"><label>C</label><input id="nC" class="name" value="狂潮生技"><input id="pBaseC" value="1000"></div>
    <div class="hint">改名稱或初始價格後，按「重置盤面」才會套用並同步到所有裝置。</div>

    <div class="sec">跳動參數</div>
    <div class="p"><label>tick 間隔下限（秒）</label><input id="pTickMin" value="0.8"></div>
    <div class="p"><label>tick 間隔上限（秒）</label><input id="pTickMax" value="2.0"></div>
    <div class="p"><label>穩健期單跳上限 %</label><input id="pAmpS" value="1.5"></div>
    <div class="p"><label>成長期單跳上限 %</label><input id="pAmpG" value="2.2"></div>
    <div class="p"><label>投機期單跳上限 %</label><input id="pAmpP" value="3.0"></div>
    <div class="p"><label>成長期每跳偏移 %</label><input id="pDrift" value="0.25"></div>
    <div class="p"><label>漲跌停 ±%</label><input id="pLimit" value="15"></div>

    <div class="sec">狀態切換</div>
    <div class="p"><label>狀態維持下限（秒）</label><input id="pModeMin" value="8"></div>
    <div class="p"><label>狀態維持上限（秒）</label><input id="pModeMax" value="20"></div>

    <div class="sec">趨勢線</div>
    <div class="p"><label>視窗長度（秒）</label><input id="pWindow" value="84"></div>
    <div class="hint">84 秒約等於 60 個點；滿了之後往左捲動。跳動參數改完立即生效，不用重開盤。</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";

/* ───────── Firebase ───────── */
const firebaseConfig = {
  apiKey: "AIzaSyAoLICybR4P-bzVb_wCwcscsQ3Pd7yiT2s",
  authDomain: "kuya-stock-game.firebaseapp.com",
  databaseURL: "https://kuya-stock-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kuya-stock-game",
  storageBucket: "kuya-stock-game.firebasestorage.app",
  messagingSenderId: "34287693549",
  appId: "1:34287693549:web:c617470b93badfaa7a66e4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refMarket = db.ref('market');
const refPlayers = db.ref('players');

const $ = id=>document.getElementById(id);
db.ref('.info/connected').on('value', s=>{
  const ok = s.val() === true;
  $('dot').classList.toggle('ok', ok);
  $('connTxt').textContent = ok ? '已連線 Firebase' : '連線中斷，重新連線中…';
});

/* ───────── 參數 ───────── */
const P = {
  tickMin:0.8,tickMax:2.0,ampS:0.015,ampG:0.022,ampP:0.030,
  drift:0.0025,limit:0.15,modeMin:8,modeMax:20,windowSec:84,
  baseA:1000,baseB:1000,baseC:1000,roundSec:90,warnSec:10
};
/* 伺服器時間與本機的偏移，用於各裝置倒數同步 */
let srvOffset=0;
db.ref('.info/serverTimeOffset').on('value',s=>{ srvOffset = s.val() || 0; });
const MAX_POINTS = 200, ROUNDS = 5;
const DEFS = [
  {id:'A',color:'--a',w:{stable:.60,growth:.30,spec:.10}},
  {id:'B',color:'--b',w:{stable:.25,growth:.55,spec:.20}},
  {id:'C',color:'--c',w:{stable:.15,growth:.25,spec:.60}}
];
const MODE_LABEL={stable:'穩健',growth:'成長',spec:'投機'};
const MODE_SHAPE={stable:1.5,growth:1.0,spec:0.65};

let stocks=[], state='idle', round=1, roundStart=0, timers=[], restoring=true;

const rand=(a,b)=>a+Math.random()*(b-a);
const ampOf=m=>m==='stable'?P.ampS:m==='growth'?P.ampG:P.ampP;
function pickMode(w){const r=Math.random(),s=w.stable,g=s+w.growth;return r<s?'stable':r<g?'growth':'spec';}

function makeStocks(){
  const bases=[P.baseA,P.baseB,P.baseC];
  const names=[$('nA').value.trim()||'A股',$('nB').value.trim()||'B股',$('nC').value.trim()||'C股'];
  stocks=DEFS.map((d,i)=>({...d,name:names[i],price:bases[i],open:bases[i],
    mode:pickMode(d.w),modeUntil:0,hist:[],hi:bases[i],lo:bases[i],ticks:0,flash:0}));
}

/* ───────── 寫入 Firebase ───────── */
function pushMarket(){
  const o={state,round,endAt,warnSec:P.warnSec,roundSec:P.roundSec,stocks:{}};
  stocks.forEach(s=>{ o.stocks[s.id]={name:s.name,price:+s.price.toFixed(2),open:+s.open.toFixed(2),mode:s.mode,ticks:s.ticks}; });
  refMarket.update(o);
}
function pushStock(s){
  refMarket.child('stocks/'+s.id).update({price:+s.price.toFixed(2),mode:s.mode,ticks:s.ticks});
}

/* ───────── 價格引擎 ───────── */
function tick(s){
  const now=performance.now();
  if(now>s.modeUntil){ s.mode=pickMode(s.w); s.modeUntil=now+rand(P.modeMin,P.modeMax)*1000; }
  const amp=ampOf(s.mode);
  const mag=amp*Math.pow(Math.random(),MODE_SHAPE[s.mode]);
  const drift=s.mode==='growth'?P.drift:0;
  let pct=drift+(Math.random()<0.5?-mag:mag);
  pct=Math.max(-amp,Math.min(amp,pct));
  let np=s.price*(1+pct);
  np=Math.min(s.open*(1+P.limit),Math.max(s.open*(1-P.limit),np));
  s.price=np; s.ticks++;
  s.hi=Math.max(s.hi,np); s.lo=Math.min(s.lo,np);
  s.hist.push({t:now,p:np});
  if(s.hist.length>MAX_POINTS) s.hist.shift();
  s.flash=now;
  pushStock(s);
  schedule(s);
}
function schedule(s){
  timers.push(setTimeout(()=>{ if(state==='open') tick(s); }, rand(P.tickMin,P.tickMax)*1000));
}
function startTicking(){
  stopTicking();
  const now=performance.now();
  stocks.forEach(s=>{ s.modeUntil=now+rand(P.modeMin,P.modeMax)*1000; schedule(s); });
}
function stopTicking(){ timers.forEach(clearTimeout); timers=[]; }

/* ───────── 盤面控制 ───────── */
let endAt=0;          // 本回合結束的伺服器時間戳
let autoTimer=null;

function openMarket(){
  if(state==='open') return;
  readParams();
  stocks.forEach(s=>{ s.open=s.price; s.hi=s.price; s.lo=s.price; s.ticks=0; s.hist=[{t:performance.now(),p:s.price}]; });
  state='open'; roundStart=performance.now();
  endAt = Date.now() + srvOffset + P.roundSec*1000;
  pushMarket(); startTicking(); render();
  if(autoTimer) clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>{ closeMarket(); }, P.roundSec*1000);
}

function closeMarket(){
  if(state!=='open') return;
  if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
  stopTicking();
  state='closed'; endAt=0;
  if(round<ROUNDS) round++;
  pushMarket(); render();
}

function resetBoard(){
  stopTicking();
  if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
  readParams(); makeStocks();
  state='idle'; round=1; endAt=0;
  pushMarket(); render();
}
function clearPlayers(){ refPlayers.remove(); }

/* ───────── 斷線復原 ───────── */
refMarket.once('value').then(snap=>{
  const d=snap.val();
  readParams();
  if(d && d.stocks){
    makeStocks();
    stocks.forEach(s=>{
      const r=d.stocks[s.id]; if(!r) return;
      s.name=r.name||s.name; s.price=r.price; s.open=r.open;
      s.mode=r.mode||s.mode; s.ticks=r.ticks||0;
      s.hi=r.price; s.lo=r.price;
      s.hist=[{t:performance.now(),p:r.price}];
    });
    round=d.round||1;
    state=(d.state||'idle');
    $('nA').value=stocks[0].name; $('nB').value=stocks[1].name; $('nC').value=stocks[2].name;
    if(d.roundSec) $('pRoundSec').value=d.roundSec;
    if(d.warnSec!=null) $('pWarnSec').value=d.warnSec;
    readParams();
    if(state==='open'){
      roundStart=performance.now();
      endAt=d.endAt||0;
      const left=endAt ? endAt-(Date.now()+srvOffset) : 0;
      if(left>0){
        startTicking();
        if(autoTimer) clearTimeout(autoTimer);
        autoTimer=setTimeout(()=>{ closeMarket(); }, left);
      }else{
        state='closed'; endAt=0;
      }
    }
    pushMarket();
  }else{
    makeStocks(); pushMarket();
  }
  restoring=false; render(); resize();
});

refPlayers.on('value', s=>{ $('pcount').textContent = s.numChildren(); });

/* ───────── 參數 ───────── */
const numOf=(el,def)=>{const v=parseFloat(el.value);return isFinite(v)?v:def;};
function readParams(){
  P.tickMin=Math.max(0.2,numOf($('pTickMin'),0.8));
  P.tickMax=Math.max(P.tickMin,numOf($('pTickMax'),2.0));
  P.ampS=numOf($('pAmpS'),1.5)/100;
  P.ampG=numOf($('pAmpG'),2.2)/100;
  P.ampP=numOf($('pAmpP'),3.0)/100;
  P.drift=numOf($('pDrift'),0.25)/100;
  P.limit=numOf($('pLimit'),15)/100;
  P.modeMin=numOf($('pModeMin'),8);
  P.modeMax=Math.max(P.modeMin,numOf($('pModeMax'),20));
  P.windowSec=Math.max(10,numOf($('pWindow'),84));
  P.baseA=numOf($('pBaseA'),1000);
  P.baseB=numOf($('pBaseB'),1000);
  P.baseC=numOf($('pBaseC'),1000);
  P.roundSec=Math.max(10,numOf($('pRoundSec'),90));
  P.warnSec=Math.max(0,Math.min(P.roundSec,numOf($('pWarnSec'),10)));
}
['pTickMin','pTickMax','pAmpS','pAmpG','pAmpP','pDrift','pLimit','pModeMin','pModeMax','pWindow']
  .forEach(id=>$(id).addEventListener('change',readParams));
['pRoundSec','pWarnSec'].forEach(id=>$(id).addEventListener('change',()=>{
  readParams();
  refMarket.update({warnSec:P.warnSec,roundSec:P.roundSec});
}));

/* ───────── 圖表 ───────── */
const cv=$('cv'), ctx=cv.getContext('2d');
let axisMode='pct';
function resize(){
  const r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(!stocks.length){ requestAnimationFrame(draw); return; }
  const padL=68,padR=80,padT=18,padB=26;
  const iw=w-padL-padR, ih=h-padT-padB;
  const now=performance.now(), t1=now, t0=now-P.windowSec*1000;
  let ymin,ymax,toY;
  if(axisMode==='pct'){
    const span=P.limit*100+3; ymin=-span; ymax=span;
    toY=(s,p)=>padT+ih*(1-((p/s.open-1)*100-ymin)/(ymax-ymin));
  }else{
    let lo=Infinity,hi=-Infinity;
    stocks.forEach(s=>s.hist.forEach(pt=>{if(pt.t>=t0){lo=Math.min(lo,pt.p);hi=Math.max(hi,pt.p);}}));
    if(!isFinite(lo)){lo=0;hi=1;}
    const pad=(hi-lo)*0.12||hi*0.05||1;
    ymin=lo-pad; ymax=hi+pad;
    toY=(s,p)=>padT+ih*(1-(p-ymin)/(ymax-ymin));
  }
  const toX=t=>padL+iw*Math.min(1,Math.max(0,(t-t0)/(t1-t0)));

  ctx.font='11px ui-monospace,monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=8;i++){
    const y=padT+ih*i/8, val=ymax-(ymax-ymin)*i/8;
    const zero=axisMode==='pct'&&Math.abs(val)<0.001;
    ctx.strokeStyle=zero?'#2e3d52':'#19212d'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,y+.5); ctx.lineTo(w-padR,y+.5); ctx.stroke();
    ctx.fillStyle='#5d6d82';
    ctx.fillText(axisMode==='pct'?val.toFixed(1)+'%':val.toFixed(0),padL-10,y);
  }
  if(axisMode==='pct'){
    [P.limit*100,-P.limit*100].forEach(v=>{
      const y=padT+ih*(1-(v-ymin)/(ymax-ymin));
      ctx.strokeStyle=v>0?'rgba(255,77,94,.34)':'rgba(0,214,143,.34)';
      ctx.setLineDash([5,5]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.textAlign='left'; ctx.fillStyle=v>0?'rgba(255,77,94,.75)':'rgba(0,214,143,.75)';
      ctx.fillText(v>0?'漲停':'跌停',w-padR+8,y); ctx.textAlign='right';
    });
  }
  stocks.forEach(s=>{
    const pts=s.hist.filter(pt=>pt.t>=t0-3000);
    if(!pts.length) return;
    const col=css(s.color);
    ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    pts.forEach((pt,i)=>{const x=toX(pt.t),y=toY(s,pt.p); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    const last=pts[pts.length-1];
    ctx.lineTo(toX(now),toY(s,last.p)); ctx.stroke();
    const ex=toX(now),ey=toY(s,last.p);
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(ex,ey,3.5,0,7); ctx.fill();
    ctx.globalAlpha=.18; ctx.beginPath(); ctx.arc(ex,ey,9,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.textAlign='left'; ctx.font='bold 12px ui-monospace,monospace';
    ctx.fillText(last.p.toFixed(1),ex+12,ey);
    ctx.font='11px ui-monospace,monospace'; ctx.textAlign='right';
  });
  requestAnimationFrame(draw);
}

/* ───────── 右欄 ───────── */
function cardsHTML(){
  return stocks.map(s=>{
    const chg=(s.price/s.open-1)*100;
    const col=chg>0.001?'var(--up)':chg<-0.001?'var(--down)':'var(--flat)';
    const mcls=s.mode==='growth'?'m-growth':s.mode==='spec'?'m-spec':'';
    return `<div class="card" style="--k:var(${s.color})">
      <div class="row1"><div class="nm">${s.name}</div><div class="mode ${mcls}">${MODE_LABEL[s.mode]}</div></div>
      <div><span class="px num" style="color:${col}">${s.price.toFixed(1)}</span><span class="chg num" style="color:${col}">${chg>0?'+':''}${chg.toFixed(2)}%</span></div>
      <div class="meta num"><span>開 ${s.open.toFixed(1)}</span><span>高 ${s.hi.toFixed(1)}</span><span>低 ${s.lo.toFixed(1)}</span><span>${s.ticks} tick</span></div>
    </div>`;
  }).join('');
}
function render(){
  if(!stocks.length) return;
  $('cards').innerHTML=cardsHTML();
  $('round').innerHTML=`第 ${round} 回合<small>／ ${ROUNDS}</small>`;
  $('lgA').textContent=stocks[0].name; $('lgB').textContent=stocks[1].name; $('lgC').textContent=stocks[2].name;
  const st=$('state'); st.className='';
  if(state==='idle') st.textContent='尚未開盤';
  else if(state==='open'){ st.textContent='開盤中'; st.className='open'; }
  else st.textContent='已關盤';
  $('btnOpen').disabled=(state==='open');
  $('btnEarly').disabled=(state!=='open');
}
function loop(){
  if(stocks.length) $('cards').innerHTML=cardsHTML();
  if(state==='open' && endAt){
    const left=Math.max(0,Math.ceil((endAt-(Date.now()+srvOffset))/1000));
    $('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    $('clock').style.color = left<=P.warnSec ? 'var(--gold)' : 'var(--dim)';
  }else{
    $('clock').style.color='var(--dim)';
  }
  setTimeout(loop,200);
}

$('btnOpen').onclick=openMarket;
$('btnEarly').onclick=()=>{ if(confirm('提前結束本回合？')) closeMarket(); };
$('btnReset').onclick=()=>{ if(confirm('重置盤面？股價與回合數回到初始值，玩家資產不受影響。')) resetBoard(); };
$('btnClear').onclick=()=>{ if(confirm('清除所有玩家資料？所有人的現金與持股都會消失，無法復原。')) clearPlayers(); };
$('btnPct').onclick=()=>{axisMode='pct';$('btnPct').classList.add('on');$('btnAbs').classList.remove('on');};
$('btnAbs').onclick=()=>{axisMode='abs';$('btnAbs').classList.add('on');$('btnPct').classList.remove('on');};
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||e.target.tagName==='INPUT') return;
  e.preventDefault();
  if(state!=='open') openMarket();
});

resize(); loop(); draw();
})();
</script>
</body>
</html>
